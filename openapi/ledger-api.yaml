    CreateActivityRequest:
      type: object
      required: [activity_type_id, project_id, description, business_purpose, started_at, ended_at]
      properties:
        activity_type_id: {type: string, minLength: 1}
        project_id: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        business_purpose:
          type: string
          minLength: 1
          description: Why the work relates to the business, distinct from description.
        started_at: {type: string, format: date-time}
        ended_at:
          type: string
          format: date-time
          description: Must be strictly after started_at.
        outcome: {type: string}
        tags:
          type: array
          items: {type: string}
        reconstruction_reason:
          type: [string, 'null']
          description: Required by product convention for a manually entered past-dated activity; not enforced server-side today.
        client_timestamp: {type: [string, 'null'], format: date-time}
    Activity:
      type: object
      required:
        - activity_id
        - activity_type_id
        - project_id
        - description
        - business_purpose
        - outcome
        - tags
        - entry_method
        - reconstruction_reason
        - started_at
        - ended_at
        - exact_duration_ms
        - client_timestamp
        - server_received_at
        - voided
        - superseded
        - evidence
        - history
        - relationships
        - version
        - updated_at
      properties:
        activity_id: {type: string, minLength: 1}
        activity_type_id: {type: string, minLength: 1}
        project_id: {type: string, minLength: 1}
        description: {type: string}
        business_purpose: {type: string}
        outcome: {type: string}
        tags:
          type: array
          items: {type: string}
        entry_method: {enum: [manual, timer, split, merge]}
        reconstruction_reason: {type: [string, 'null']}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
        exact_duration_ms: {type: integer, minimum: 0}
        client_timestamp: {type: [string, 'null'], format: date-time}
        server_received_at: {type: string, format: date-time}
        voided: {type: boolean}
        superseded:
          type: boolean
          description: >-
            True when this activity was replaced by a split or merge rather
            than directly voided. A Superseded activity is always also
            voided, but cannot be restored — only a directly-voided
            (superseded: false) activity can be.
        evidence:
          type: array
          items: {$ref: '#/components/schemas/EvidenceLink'}
        history:
          type: array
          items: {type: object}
          description: Raw ledger events behind this projection (audit trail).
        relationships:
          type: object
          description: >-
            Present only when applicable: split_into (replacement activity
            ids, on a split source), merged_from (source activity ids, on a
            merge result), or merged_into (the resulting activity id, on a
            merge source).
        version: {type: string, minLength: 1}
        updated_at: {type: string, format: date-time}
    ActivityResponse:
