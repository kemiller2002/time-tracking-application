openapi: 3.1.0
info:
  title: Business Activity Ledger API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
  /config:
    get:
      operationId: getConfig
      responses:
        '200':
          description: Public authenticated-client configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigResponse'}
  /projects:
    get:
      operationId: listProjects
      responses:
        '200':
          description: Effective projects
  /activity-types:
    get:
      operationId: listActivityTypes
      responses:
        '200':
          description: Effective activity types
components:
  schemas:
    Meta:
      type: object
      required: [request_id, server_time, api_version]
      properties:
        request_id: {type: string, minLength: 1}
        server_time: {type: string, format: date-time}
        api_version: {const: v1}
    HealthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status: {enum: [ok, degraded]}
        meta: {$ref: '#/components/schemas/Meta'}
    ConfigResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '../schemas/domain/config.schema.json'}
        meta: {$ref: '#/components/schemas/Meta'}
    ErrorResponse:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
            details: {type: object}
        meta: {$ref: '#/components/schemas/Meta'}
