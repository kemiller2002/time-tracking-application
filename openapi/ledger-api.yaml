openapi: 3.1.0
info:
  title: Business Activity Ledger API
  version: 0.1.0
  description: >-
    Every non-GET request may optionally be wrapped as
    `{ "request_id": "...", "payload": { ...the fields documented on that
    endpoint... } }`; if omitted, those fields are sent directly as the
    request body. A request whose id — that `request_id`, or the
    `Idempotency-Key` / `X-Request-Id` header — matches an earlier non-GET
    request returns the earlier result again with `idempotent_replay: true`
    added, always as HTTP 200 regardless of the original status code (e.g. a
    replayed `POST /activities` comes back 200, not 201) — an observed quirk
    of the replay path, documented here rather than modeled per endpoint.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
  /session:
    get:
      operationId: getSession
      description: >-
        Returns the caller's session status. authenticated is currently
        always true in this implementation — a request that fails
        authentication is already rejected with 401 before reaching this
        route, so this field cannot presently return false.
      responses:
        '200':
          description: Session status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /config:
    get:
      operationId: getConfig
      responses:
        '200':
          description: Public authenticated-client configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigResponse'}
  /projects:
    get:
      operationId: listProjects
      responses:
        '200':
          description: Effective projects
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectListResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /activity-types:
    get:
      operationId: listActivityTypes
      responses:
        '200':
          description: Effective activity types
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityTypeListResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /timers/current:
    get:
      operationId: getCurrentTimer
      description: Returns the caller's active timer, or null if none is running or paused.
      responses:
        '200':
          description: Current timer state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TimerCurrentResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /timers/start:
    post:
      operationId: startTimer
      description: >-
        Starts a timer for the caller. Only one timer may be active at a time;
        starting a second one while one is already running or paused fails
        with 409 timer_already_running.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartTimerRequest'}
      responses:
        '200':
          description: Timer started
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TimerResponse'}
        '400':
          description: activity_type_id or project_id missing (validation_failed)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: A timer is already active (timer_already_running); details.current_timer carries it
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /timers/pause:
    post:
      operationId: pauseTimer
      description: Pauses the caller's running timer. The paused interval is excluded from the eventual recorded duration.
      responses:
        '200':
          description: Timer paused
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TimerResponse'}
        '404':
          description: No active timer exists (timer_not_found)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Timer is not running (timer_not_running)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /timers/resume:
    post:
      operationId: resumeTimer
      description: Resumes the caller's paused timer.
      responses:
        '200':
          description: Timer resumed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TimerResponse'}
        '404':
          description: No active timer exists (timer_not_found)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Timer is not paused (timer_not_paused)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /timers/stop:
    post:
      operationId: stopTimer
      description: >-
        Stops the caller's timer and computes exact elapsed working time
        (paused intervals excluded), rounded to the nearest whole minute for
        exact_minutes. This does not itself create an activity record — the
        caller separately calls POST /activities with the resulting times to
        record it, matching how a manual entry is recorded. If the elapsed
        working time is under 30 seconds, status is discarded (discarded is
        true) and the caller must not call POST /activities for it — per
        DOMAIN-REQUIREMENTS.md, nothing is recorded for a session that short.
      responses:
        '200':
          description: Timer stopped
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TimerStopResponse'}
        '404':
          description: No active timer exists (timer_not_found)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /activities:
    post:
      operationId: createActivity
      description: >-
        Records a new activity. started_at and ended_at are exact to the
        minute — six-minute controls, if used by a client, are an input
        convenience only and must not alter what is sent here. The interval
        must fall on a single calendar day and must not overlap any other
        Recorded activity on that date.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateActivityRequest'}
      responses:
        '201':
          description: Activity recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityResponse'}
        '400':
          description: >-
            A required field is missing (validation_failed), ended_at is not
            after started_at (invalid_time_range), or started_at/ended_at
            fall on different calendar days (crosses_midnight)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: >-
            The interval overlaps another Recorded activity on the same date
            (overlapping_activity); details.conflicting_activity_id names it
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /days/{date}:
    get:
      operationId: getDay
      parameters:
        - name: date
          in: path
          required: true
          schema: {type: string, format: date}
      responses:
        '200':
          description: Effective activities and totals for the date, excluding voided activities from totals
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DaySummaryResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /days/{date}/review:
    get:
      operationId: getDayReview
      description: >-
        Same as GET /days/{date} plus a warnings list. warnings is always
        empty today — none of the overlap, incomplete-description, or
        missing-evidence checks the execution contract's Capability 13
        describes are implemented yet.
      parameters:
        - name: date
          in: path
          required: true
          schema: {type: string, format: date}
      responses:
        '200':
          description: Day summary with (currently always-empty) review warnings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DayReviewResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /days/{date}/attest:
    post:
      operationId: attestDay
      description: >-
        Records the caller's attestation of a day. A correction made after
        attestation remains legal; attestation is a checkpoint, not a lock.
        Attesting again for the same day adds a new attestation rather than
        replacing the earlier one.
      parameters:
        - name: date
          in: path
          required: true
          schema: {type: string, format: date}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttestDayRequest'}
      responses:
        '200':
          description: Attestation recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttestationResponse'}
        '400':
          description: statement missing (validation_failed)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: The day's activities changed after projection_version was read (stale_projection)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /months/{month}:
    get:
      operationId: getMonth
      parameters:
        - name: month
          in: path
          required: true
          schema: {type: string, pattern: '^\d{4}-\d{2}$'}
      responses:
        '200':
          description: Effective activities and totals for the month, excluding voided activities from totals
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MonthSummaryResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reports/daily/{date}:
    get:
      operationId: getDailyReport
      description: Only the JSON format is implemented; the execution contract's Markdown/CSV export (Capability 15) does not exist yet.
      parameters:
        - name: date
          in: path
          required: true
          schema: {type: string, format: date}
      responses:
        '200':
          description: Daily report wrapping the day summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DailyReportResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reports/monthly/{month}:
    get:
      operationId: getMonthlyReport
      description: Only the JSON format is implemented; the execution contract's Markdown/CSV export (Capability 15) does not exist yet.
      parameters:
        - name: month
          in: path
          required: true
          schema: {type: string, pattern: '^\d{4}-\d{2}$'}
      responses:
        '200':
          description: Monthly report wrapping the month summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MonthlyReportResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /activities/{activityId}:
    get:
      operationId: getActivity
      parameters:
        - name: activityId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current effective activity projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityResponse'}
        '404':
          description: Activity was not found (activity_not_found)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /activities/{activityId}/amendments:
    post:
      operationId: amendActivity
      description: >-
        Corrects fields on a Recorded activity, preserving its identity and
        history. Only a Recorded activity can be amended — a Voided or
        Superseded one cannot. activity_id and entry_method may not be
        changed even if present in changes — they are silently stripped. The
        resulting activity (current fields merged with changes) is
        re-validated by the same rules as creation: required fields, valid
        time range, no midnight crossing, and no overlap with any other
        Recorded activity on the same date (the activity's own prior
        interval is excluded from that check).
      parameters:
        - name: activityId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AmendActivityRequest'}
      responses:
        '200':
          description: Amended activity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityResponse'}
        '400':
          description: >-
            changes or reason missing (validation_failed), the resulting
            description/business_purpose/activity_type_id/project_id would be
            blank (validation_failed), the resulting time range is invalid
            (invalid_time_range), or the resulting interval crosses midnight
            (crosses_midnight)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Activity was not found (activity_not_found)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: >-
            base_version no longer matches the activity's current version
            (stale_projection; details.current carries the current activity),
            the resulting interval overlaps another Recorded activity on
            the same date (overlapping_activity; details.conflicting_activity_id),
            or the activity is not currently Recorded — it is Voided or
            Superseded (activity_not_recorded; details.superseded)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /activities/{activityId}/void:
    post:
      operationId: voidActivity
      description: Marks the activity Voided (not deleted); it stops counting toward totals but remains retrievable as history.
      parameters:
        - name: activityId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequest'}
      responses:
        '200':
          description: Voided activity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityResponse'}
        '400':
          description: reason missing (validation_failed)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Activity was not found (activity_not_found)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: base_version stale (stale_projection), or the activity is already voided (already_voided)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /activities/{activityId}/restore:
    post:
      operationId: restoreActivity
      description: Restores a Voided activity back to Recorded. Only Voided activities can be restored — Superseded (split/merged) activities cannot.
      parameters:
        - name: activityId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequest'}
      responses:
        '200':
          description: Restored activity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityResponse'}
        '400':
          description: reason missing (validation_failed)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Activity was not found (activity_not_found)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: >-
            base_version stale (stale_projection), the activity is not
            currently voided (not_voided), or the activity is Superseded —
            replaced by a split or merge, not directly voided
            (activity_superseded)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /activities/{activityId}/split:
    post:
      operationId: splitActivity
      description: >-
        Splits a Recorded activity into two or more replacement activities
        that exactly cover its original time span; the source becomes
        Superseded (represented here as voided, with relationships.split_into
        listing the replacements). Only a Recorded activity can be split — a
        Voided or already-Superseded one cannot.
      parameters:
        - name: activityId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SplitActivityRequest'}
      responses:
        '200':
          description: Source and replacement activities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SplitActivityResponse'}
        '400':
          description: >-
            parts or reason missing (validation_failed), fewer than two parts
            (invalid_split), the source is under two minutes long
            (too_short_to_split), or part durations don't sum to the source's
            exact_duration_ms (duration_invariant_failed; details.expected /
            details.actual)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Activity was not found (activity_not_found)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: >-
            base_version stale (stale_projection), or the activity is not
            currently Recorded — it is Voided or Superseded
            (activity_not_recorded; details.superseded)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /activities/merge:
    post:
      operationId: mergeActivities
      description: >-
        Merges two or more Recorded source activities into one new activity;
        each source becomes Superseded (voided, with relationships.merged_from
        on the result listing them). Every source must currently be Recorded
        — a Voided or already-Superseded source is rejected. The store does
        not itself check that sources are contiguous or share a date — see
        DOMAIN-REQUIREMENTS.md.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MergeActivitiesRequest'}
      responses:
        '200':
          description: Merged activity and its sources
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MergeActivitiesResponse'}
        '400':
          description: a required field is missing (validation_failed), or fewer than two source_ids (invalid_merge)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: A source activity was not found (activity_not_found)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: >-
            A source's base_versions entry is stale (stale_projection), or a
            source is not currently Recorded — it is Voided or Superseded
            (activity_not_recorded; details.superseded)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /activities/{activityId}/evidence:
    post:
      operationId: attachEvidence
      description: >-
        Attaches evidence to an activity. Legal on a Recorded or a
        merely-Voided activity; a Superseded one rejects it — per the
        capabilities table, being replaced by a split or merge blocks new
        evidence, but a direct void does not.
      parameters:
        - name: activityId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttachEvidenceRequest'}
      responses:
        '201':
          description: Evidence attached
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttachEvidenceResponse'}
        '400':
          description: type missing (validation_failed)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Activity was not found (activity_not_found)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: >-
            base_version stale (stale_projection), or the activity is
            Superseded (activity_superseded) — a merely-Voided activity is
            still allowed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /activities/{activityId}/evidence/{evidenceLinkId}:
    delete:
      operationId: detachEvidence
      description: >-
        A DELETE request that requires a JSON body carrying reason, matching
        the implemented service contract. Unlike attaching evidence, this
        requires the activity to be Recorded — unlinking is not legal on a
        Voided or Superseded activity.
      parameters:
        - name: activityId
          in: path
          required: true
          schema: {type: string}
        - name: evidenceLinkId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequest'}
      responses:
        '200':
          description: Activity with the evidence link removed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityResponse'}
        '400':
          description: reason missing (validation_failed)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Activity was not found (activity_not_found), or that evidence link was not found on it (evidence_not_found)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: >-
            base_version stale (stale_projection), or the activity is not
            currently Recorded — it is Voided or Superseded
            (activity_not_recorded; details.superseded)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  responses:
    Unauthorized:
      description: Sign-in is required (unauthorized)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    Meta:
      type: object
      required: [request_id, server_time, api_version]
      properties:
        request_id: {type: string, minLength: 1}
        server_time: {type: string, format: date-time}
        api_version: {const: v1}
    HealthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status: {enum: [ok, degraded]}
        meta: {$ref: '#/components/schemas/Meta'}
    SessionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [authenticated, user, csrf_required]
          properties:
            authenticated: {type: boolean}
            user:
              type: object
              required: [id]
              properties:
                id: {type: string, minLength: 1}
            csrf_required: {type: boolean}
        meta: {$ref: '#/components/schemas/Meta'}
    ConfigResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '../schemas/domain/config.schema.json'}
        meta: {$ref: '#/components/schemas/Meta'}
    ProjectListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '../schemas/domain/project.schema.json'}
        meta: {$ref: '#/components/schemas/Meta'}
    ActivityTypeListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '../schemas/domain/activity-type.schema.json'}
        meta: {$ref: '#/components/schemas/Meta'}
    Timer:
      type: object
      required: [timer_id, owner, status, activity_type_id, project_id, description, started_at, paused_at, paused_ms, version]
      properties:
        timer_id: {type: string, minLength: 1}
        owner: {type: string, minLength: 1}
        status: {enum: [running, paused]}
        activity_type_id: {type: string, minLength: 1}
        project_id: {type: string, minLength: 1}
        description: {type: string}
        started_at: {type: string, format: date-time}
        paused_at: {type: [string, 'null'], format: date-time}
        paused_ms: {type: integer, minimum: 0}
        version: {type: string, minLength: 1}
    StoppedTimer:
      allOf:
        - $ref: '#/components/schemas/Timer'
        - type: object
          required: [status, stopped_at, exact_duration_ms, exact_minutes, discarded]
          properties:
            status: {enum: [stopped, discarded]}
            stopped_at: {type: string, format: date-time}
            exact_duration_ms: {type: integer, minimum: 0}
            exact_minutes:
              type: number
              minimum: 0
              description: exact_duration_ms rounded to the nearest whole minute
            discarded:
              type: boolean
              description: >-
                True when exact_duration_ms is under 30 seconds (status is
                then discarded). The caller must not record an activity for a
                discarded stop.
    StartTimerRequest:
      type: object
      required: [activity_type_id, project_id]
      properties:
        activity_type_id: {type: string, minLength: 1}
        project_id: {type: string, minLength: 1}
        description: {type: string}
    TimerCurrentResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [timer]
          properties:
            timer:
              oneOf:
                - $ref: '#/components/schemas/Timer'
                - type: 'null'
        meta: {$ref: '#/components/schemas/Meta'}
    TimerResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/Timer'}
        meta: {$ref: '#/components/schemas/Meta'}
    TimerStopResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/StoppedTimer'}
